studies:
  - id: production-equal-weight-long-flat
    title: "现役等权 long-flat"
    family: production-mapping
    status: adopted
    outcome: selected
    evidence_level: committed_formal_probe
    scope: "equal_weight 20d40z 因子以零阈值映射为 long-flat，并在既有同秤、执行价审计和风险偏好下作为现役。"
    claim: "采用理由是回撤、换手和生产风险形态，而非统计意义上的全面最优。"
    non_claims: ["不声称其 Sharpe 显著高于对称映射。", "不声称它在所有未来样本和所有映射中全局最优。"]
    caveats: ["①a 配对 block bootstrap 的 Sharpe 差未达到显著。", "现有执行引擎经济上等价于按信号日收盘成交。"]
    reopen_condition: "出现预登记的新映射或独立信息源并在同秤门槛下通过时重开。"
    production: {affects: true, role: incumbent}
    documents:
      spec: [docs/plans/2026-06-18-equal-weight-signal-design.md, docs/plans/2026-08-12-probe-1a-symmetric-vs-longflat.md]
      report: [docs/plans/2026-07-11-external-review-fixes.md, docs/plans/2026-08-13-exec-price-audit.md]
      evidence: [backtest/output/probe_1a_paired_bootstrap.csv, backtest/output/probe_exec_price_summary.json]
    supersedes: []
    depends_on: []

  - id: mapping-grid-32
    title: "持仓映射 32 格"
    family: position-mapping
    status: closed
    outcome: stop
    evidence_level: committed_formal_probe
    scope: "冻结的 4×2×4 映射网格、2014-2023 选择窗和预登记三项部署门槛。"
    claim: "网格内没有候选同时通过三项门槛，现役保持不变。"
    non_claims: ["不证明所有可能的持仓映射均劣于现役。"]
    caveats: ["部分候选 Sharpe 更高，但伴随更深回撤或更高换手。"]
    reopen_condition: "网格外候选必须先给出新机制并重新预登记。"
    production: {affects: true, role: incumbent_unchanged}
    documents:
      spec: [docs/plans/2026-08-13-probe-1b-mapping-grid.md]
      report: [docs/plans/2026-08-13-probe-1b-mapping-grid.md]
      evidence: [backtest/output/probe_1b_mapping_verdict.csv, backtest/output/probe_1b_mapping_summary.json]
    supersedes: []
    depends_on: [production-equal-weight-long-flat]

