    non_claims: ["不得引作F1无效——准确表述是F1在三关上成立、在冻结的关0上未过，且未过的直接原因是关0空分布跨k池化。", "不得引作资金流对个股或行业无价值（未测）。", "不得引作未残差化原始流无价值（原始流81%是价格，属价格类面既有结论）。", "不得引作中证500/1000/2000资金流无价值——Wind这张表根本不给这三个板块，属未测。", "开盘/尾盘拆分、超大/大单拆分、只数口径、Wind的maininflowmoney字段口径均未登记。"]
    caveats: ["方向与预登记先验相反：先验记的是短期反转，实测k=5近零偏负但k=20/40显著正（短腿反转、长腿延续）；先验只记录不作闸。", "IC随k单调上升（542→66个窗口），与慢腿化命题一致但也是窗口数下降的典型伪影形态，本样本内不可分离。", "wset marketmoneyflows的sector是白名单枚举，只支持沪深300/创业板/科创板（约50个候选含中英文两套写法一致被拒），初稿四指数设计因此作废。", "数据起点2015-01-05非2014；科创腿因科创综指基期2019-12-31只能自2020-07有残差，未进主检验。", "Wind对该表静默截断到窗口末尾约62~66行不报错，取数须分块+日历硬校验。", "全样本只有main_in−main_out≡extra+large成立；maininflowmoney字段25%行不符、四档零和41%行不成立，构造用机械自洽的(in−out)/(in+out)。", "教训（已收窄）：不是「⓪不该跨k池化」——max-T本就该在整个搜索空间取最大，是有意的保守；而是「选max-T还是min-P应在预登记里论证，不能默认」。本面网格跨k的非重叠窗口数差8倍却未论证即冻max-T。"]
